<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="黑流树海氛围背景占位图">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#040809"/>
      <stop offset="0.42" stop-color="#071415"/>
      <stop offset="0.72" stop-color="#0b1d1c"/>
      <stop offset="1" stop-color="#030706"/>
    </linearGradient>
    <radialGradient id="halo" cx="72%" cy="31%" r="46%">
      <stop offset="0" stop-color="#d86643" stop-opacity=".55"/>
      <stop offset=".17" stop-color="#8b3b32" stop-opacity=".24"/>
      <stop offset=".48" stop-color="#16413d" stop-opacity=".18"/>
      <stop offset="1" stop-color="#041010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4be0bc" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4be0bc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06100f" stop-opacity="0"/>
      <stop offset=".2" stop-color="#081817" stop-opacity=".95"/>
      <stop offset=".54" stop-color="#0b2725"/>
      <stop offset=".78" stop-color="#051110"/>
      <stop offset="1" stop-color="#020606"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030807"/>
      <stop offset=".65" stop-color="#020505"/>
      <stop offset="1" stop-color="#000202"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7de7c6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7de7c6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .11"/>
      </feComponentTransfer>
    </filter>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#9fe4d0" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1920" height="1080"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1920" height="1080" fill="url(#sky)"/>
    <rect width="1920" height="1080" fill="url(#grid)"/>
    <rect width="1920" height="1080" fill="url(#halo)"/>

    <!-- distant sun, half swallowed by the canopy -->
    <circle cx="1432" cy="322" r="255" fill="#d96a45" fill-opacity=".10" filter="url(#soft)"/>
    <circle cx="1432" cy="322" r="166" fill="none" stroke="#ec986e" stroke-opacity=".24" stroke-width="2"/>
    <circle cx="1432" cy="322" r="146" fill="#a9402c" fill-opacity=".11"/>
    <circle cx="1432" cy="322" r="147" fill="none" stroke="#f0a277" stroke-opacity=".18" stroke-width="1" stroke-dasharray="2 11"/>
    <path d="M1150 322h564" stroke="#eaa079" stroke-opacity=".10" stroke-width="1"/>

    <!-- faint topographic contours -->
    <g fill="none" stroke="#7ac7b4" stroke-opacity=".055" stroke-width="1">
      <path d="M-40 730C210 640 312 720 470 676s264-166 474-130 258 177 448 136 272-190 612-138"/>
      <path d="M-60 780C188 682 326 776 494 720s258-160 460-120 282 170 474 127 284-170 590-119"/>
      <path d="M-70 840C194 742 338 832 526 772s240-144 426-110 292 165 484 121 306-148 586-101"/>
      <path d="M120 900c223-65 344 43 530-2s214-115 396-96 312 117 484 75 306-112 502-79"/>
    </g>

    <!-- atmospheric mist -->
    <ellipse cx="430" cy="805" rx="600" ry="190" fill="#2e8f7d" fill-opacity=".07" filter="url(#soft)"/>
    <ellipse cx="1520" cy="740" rx="540" ry="180" fill="#d0714f" fill-opacity=".055" filter="url(#soft)"/>

    <!-- far trunk silhouettes -->
    <g fill="#020606" opacity=".68">
      <path d="M1618 1080c-24-144-9-285 32-435 13-48 7-105-14-167l20-8c32 65 45 126 33 186-36 144-44 274-17 424z"/>
      <path d="M1742 1080c8-176 51-322 130-457l18 10c-68 134-104 284-101 447z"/>
      <path d="M1880 1080c-26-130-20-252 21-366l16 6c-34 114-36 234-7 360z"/>
    </g>

    <!-- central black tree -->
    <g stroke="url(#branch)" fill="none" stroke-linecap="round">
      <path d="M1287 1080c8-136 23-254 58-376 25-89 57-172 105-253" stroke-width="58"/>
      <path d="M1350 704c-40-75-84-119-143-163" stroke-width="30"/>
      <path d="M1368 622c53-40 101-65 164-82" stroke-width="24"/>
      <path d="M1402 530c-31-43-57-91-72-145" stroke-width="20"/>
      <path d="M1440 456c44-13 85-37 125-68" stroke-width="17"/>
      <path d="M1314 756c-70-8-120-28-172-59" stroke-width="20"/>
      <path d="M1385 598c-69-8-122-2-178 21" stroke-width="16"/>
      <path d="M1448 485c-1-57 15-108 43-159" stroke-width="15"/>
      <path d="M1211 606c-45-39-76-80-96-132" stroke-width="12"/>
      <path d="M1270 664c-24-58-28-111-12-167" stroke-width="12"/>
      <path d="M1510 442c28-47 68-84 120-109" stroke-width="11"/>
      <path d="M1460 430c14-45 8-88-17-132" stroke-width="9"/>
      <path d="M1330 650c16-63 13-117-12-175" stroke-width="10"/>
      <path d="M1420 520c58 5 107 26 151 59" stroke-width="9"/>
      <path d="M1370 710c0-59 17-110 51-158" stroke-width="11"/>
      <path d="M1295 808c-38-35-65-74-81-121" stroke-width="9"/>
    </g>
    <g stroke="#79d9bb" stroke-opacity=".15" fill="none" stroke-linecap="round">
      <path d="M1340 760c-34-51-56-106-65-170" stroke-width="2"/>
      <path d="M1400 512c-20-44-29-88-24-136" stroke-width="1.4"/>
      <path d="M1462 430c10-34 7-67-7-101" stroke-width="1.2"/>
      <path d="M1370 620c45-19 86-47 123-83" stroke-width="1.3"/>
    </g>

    <!-- hanging canopy, upper left -->
    <g fill="#010404" opacity=".92">
      <path d="M-40-20h542c-55 42-114 57-177 59-70 2-117 25-154 67-39 45-89 54-151 42-24-5-44 6-60 33z"/>
      <path d="M-20 57c64 18 120 9 168-24 42-29 87-40 137-29 53 12 91 1 122-36-9 58-43 91-101 102-46 9-83 35-111 77-37-22-51-57-43-104-43 35-100 39-172 14z"/>
      <path d="M320-10c13 38 6 72-23 102-24 25-33 55-27 91-35-24-48-57-37-99 12-44 4-75-26-94z"/>
    </g>

    <!-- black river / flowing root mass -->
    <path d="M-80 1015c228-74 397-26 563 7 180 36 351 32 498-33 164-73 323-75 471-16 152 60 315 52 548-30v157H-80z" fill="url(#river)"/>
    <path d="M-20 1006c209-51 352-6 505 28 197 44 369 27 521-47 132-64 255-69 390-24 175 58 319 49 524-23" fill="none" stroke="#5bd6b5" stroke-opacity=".16" stroke-width="2"/>
    <path d="M-30 1036c243-35 390 8 544 38 181 35 356 12 504-53 147-65 277-67 407-17 149 58 296 52 505-22" fill="none" stroke="#c56d4f" stroke-opacity=".10" stroke-width="1"/>
    <g fill="none" stroke="#8ff0d2" stroke-opacity=".13" stroke-width="1">
      <path d="M210 1054c73-19 123-13 176 3"/>
      <path d="M770 1067c85-23 151-20 220 2"/>
      <path d="M1320 1040c89-21 168-13 242 11"/>
      <path d="M1660 1007c68-14 128-7 188 8"/>
    </g>

    <!-- foreground root silhouettes -->
    <g fill="#010303">
      <path d="M-40 1080c117-42 207-37 298-2l20 2z"/>
      <path d="M1040 1080c68-54 139-76 232-68 82 7 135-11 181-52 22 34 28 71 16 120z"/>
      <path d="M1590 1080c33-41 88-60 161-58 63 2 103-14 138-48l71 106z"/>
    </g>

    <!-- embers and motes -->
    <g fill="#efab83">
      <circle cx="1110" cy="405" r="2.2" opacity=".7"/>
      <circle cx="1188" cy="514" r="1.5" opacity=".5"/>
      <circle cx="1530" cy="286" r="2.8" opacity=".8"/>
      <circle cx="1594" cy="445" r="1.7" opacity=".55"/>
      <circle cx="940" cy="665" r="2" opacity=".38"/>
      <circle cx="1690" cy="713" r="2.4" opacity=".42"/>
      <circle cx="764" cy="420" r="1.4" opacity=".45"/>
      <circle cx="1292" cy="352" r="1.6" opacity=".5"/>
    </g>
    <g fill="#8ff0d2">
      <circle cx="235" cy="252" r="1.4" opacity=".55"/>
      <circle cx="408" cy="410" r="1.8" opacity=".35"/>
      <circle cx="596" cy="214" r="1.2" opacity=".65"/>
      <circle cx="845" cy="534" r="1.7" opacity=".5"/>
      <circle cx="708" cy="745" r="1.3" opacity=".4"/>
      <circle cx="1035" cy="285" r="1.1" opacity=".5"/>
      <circle cx="1790" cy="568" r="1.6" opacity=".45"/>
      <circle cx="497" cy="893" r="1.2" opacity=".45"/>
    </g>

    <!-- light shafts -->
    <g fill="#d8a276" opacity=".035">
      <path d="M1380 0h210L1210 1080h-130z"/>
      <path d="M1560 0h80L1490 1080h-60z"/>
    </g>

    <!-- vignette and grain -->
    <rect width="1920" height="1080" fill="url(#tealGlow)" opacity=".28"/>
    <rect width="1920" height="1080" fill="none" stroke="#9ae8d1" stroke-opacity=".10" stroke-width="2"/>
    <rect width="1920" height="1080" filter="url(#grain)" opacity=".38"/>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset=".42" stop-color="#000" stop-opacity="0"/>
      <stop offset=".82" stop-color="#000" stop-opacity=".42"/>
      <stop offset="1" stop-color="#000" stop-opacity=".86"/>
    </radialGradient>
    <rect width="1920" height="1080" fill="url(#vignette)"/>
  </g>
</svg>
